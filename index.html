];
let week=+(localStorage.getItem("rc_week_v6")||1);
let links=JSON.parse(localStorage.getItem("rc_links_v6")||"{}");
function saveLinks(){localStorage.setItem("rc_links_v6",JSON.stringify(links));}
function key(w,s){return (w+1)+"-"+s;}
function actLabel(a,i){return `${a.date} ${a.time||""} · ${a.km.toFixed(1)} km · ${fmtP(a.pace)}/km`}
function linkedActivity(w,s){let i=links[key(w,s)];return (i!==undefined&&DATA.activities[i])?DATA.activities[i]:null}
function setLink(w,s,v){if(v===""){delete links[key(w,s)]}else{links[key(w,s)]=+v}saveLinks();plan();}
function logStore(){return JSON.parse(localStorage.getItem("runcoach_v6_logs")||"{}")}
function weekDone(i){let logs=logStore();return PLAN.filter(p=>p.week===i+1).filter((p,idx)=>logs[p.id]||linkedActivity(i,idx)).length}
function nav(a){["h","p","g","s"].forEach(id=>document.getElementById(id).classList.remove("active"));document.getElementById({home:"h",plan:"p",garmin:"g",supp:"s"}[a]).classList.add("active")}
function show(a){nav(a);a==="home"?home():a==="plan"?plan():a==="garmin"?garmin():supp()}
function fmtP(p){if(p==null)return"–";let m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0}return m+":"+String(s).padStart(2,"0")}
function home(){
 let recent=DATA.activities.slice(-8), total=recent.reduce((x,y)=>x+y.km,0), d=weekDone(week-1), logs=logStore();
 let wp=PLAN.filter(p=>p.week===week);
 x.innerHTML=`<div class="card hero"><span class="tag">V6 · 4 løb/uge</span><div class="big">VO2max · Tempo · let fart · lang tur</div>
 <p class="muted">${DATA.activities.length} Garmin-løb fra 2026 er indlæst.</p><p>Planen er nu bygget op omkring <b>4 ugentlige løb</b>: 2 kvalitetsdage, 1 let fartdag og 1 lang tur. Pace er et pejlemærke — følelse og afslappet teknik kommer først.</p></div>
 <div class="grid"><div class="stat"><span class="muted">HM PR</span><b>1:21:52</b></div><div class="stat"><span class="muted">5K mål</span><b>17:30</b></div><div class="stat"><span class="muted">Denne uge</span><b>${d}/4 pas</b></div><div class="stat"><span class="muted">Sidste 8</span><b>${total.toFixed(1)} km</b></div></div>
 <div class="card"><b>Uge ${week} · ${PLAN.find(p=>p.week===week).weekLabel}</b><div class="progress"><i style="width:${d/4*100}%"></i></div>
 ${wp.map(p=>{let l=logs[p.id];return `<div class="mini">${l?'✓':'○'} <b>${p.type}</b> · ${p.name}${l?` <span class="done">· ${l.date}, ${l.distance||'–'} km</span>`:''}</div>`}).join('')}
 <button onclick="show('plan')">Åbn planen</button></div>
 <div class="card"><b>Seneste Garmin-pas</b>${recent.slice().reverse().map(a=>`<div class="session"><b>${a.date}</b> · ${a.km.toFixed(1)} km · ${fmtP(a.pace)}/km<br><span class="muted">Puls ${a.avg_hr||'–'} / ${a.max_hr||'–'} · kadence ${a.cadence||'–'}</span></div>`).join('')}</div>`;
}
function plan(){
 let wi=week-1, logs=logStore(), wp=PLAN.filter(p=>p.week===week), acts=DATA.activities.slice().map((a,i)=>({...a,_i:i})).reverse();
 const sel=(slot)=>{let li=linkedActivity(wi,slot);return `<select class="select" onchange="setLink(${wi},${slot},this.value)"><option value="">– Garmin-tilknytning (valgfri) –</option>${acts.map(a=>`<option value="${a._i}" ${li===a?'selected':''}>${actLabel(a,a._i)}</option>`).join('')}</select>`};
 const session=p=>{let l=logs[p.id],slot=wp.findIndex(q=>q.id===p.id),a=linkedActivity(wi,slot);
 return `<div class="session plan-session"><span class="tag">${p.type}</span><div class="plan-title"><b>${p.name}</b>${l?'<span class="done"> · ✓ Gennemført</span>':''}</div>
 <div class="plan-structure"><b>Struktur</b><br>${p.detail}</div>
 <div class="muted"><b>Arbejde:</b> ${p.main} · <b>Tempo:</b> ${p.pace} · <b>Pause:</b> ${p.recovery}</div>
 ${a?`<div class="small done">Garmin: ${a.date} · ${a.km.toFixed(1)} km · ${fmtP(a.pace)}/km · puls ${a.avg_hr||'–'}</div>`:''}
 ${l?`<div class="manual-done"><b>Logget:</b> ${l.date} · ${l.distance||'–'} km · ${l.minutes||0}:${String(l.seconds||0).padStart(2,'0')}${l.hr?' · '+l.hr+' bpm':''}${l.pace?' · '+l.pace+'/km':''}${l.notes?' · '+l.notes:''}</div>`:''}
 <div class="log-buttons"><button class="plan-log-btn" onclick="openV6Log('${p.id}')">${l?'Rediger log':'✓ Log gennemført pas'}</button></div>
 <div class="small muted" style="margin-top:8px">Garmin-link (valgfrit)</div>${sel(slot)}</div>`};
 x.innerHTML=`<h2>12 ugers plan · 4 løb/uge</h2><div class="card"><label>Aktuel uge</label><select class="select" onchange="week=+this.value;localStorage.setItem('rc_week_v6',week);plan()">${[...new Set(PLAN.map(p=>p.week))].map(i=>{let w=PLAN.find(p=>p.week===i);return `<option value="${i}" ${week===i?'selected':''}>Uge ${i} – ${w.weekLabel} · ${weekDone(i-1)}/4 gennemført</option>`}).join('')}</select></div>`+
 PLAN.filter(p=>p.week===week).map(session).join('')+
 `<div class="card"><b>Belastningsrytme</b><p class="muted">3 uger med stigende belastning → 1 lettere uge. De 2 kvalitetspas er de vigtigste belastningsdage; fartdagen skal føles let og teknisk, og den lange tur holdes primært rolig.</p></div>`;
}
function garmin(){
 let linked=new Set(Object.values(links).map(Number));
 let rows=DATA.activities.slice().reverse().slice(0,60);
 let wk=DATA.weekly.slice(-16), mx=Math.max(...wk.map(x=>x.km));
 x.innerHTML=`<h2>Garmin-data</h2><div class="card"><b>Seneste 60 løb</b><p class="muted">✓ betyder, at passet er tilknyttet et pas i planen.</p><table><tr><th>Dato</th><th>Km</th><th>Pace</th><th>Puls</th><th></th></tr>${rows.map(a=>{let i=DATA.activities.indexOf(a);return `<tr><td>${a.date}</td><td>${a.km.toFixed(1)}</td><td>${fmtP(a.pace)}</td><td>${a.avg_hr||'–'}</td><td>${linked.has(i)?'<span class="done">✓ Plan</span>':'<span class="muted">Ikke mappet</span>'}</td></tr>`}).join('')}</table></div>
 <div class="card"><b>Ugentlig mængde</b>${wk.map(w=>`<div class="session"><div><b>${w.week}</b> · ${w.km.toFixed(1)} km · ${w.runs} løb</div><div class="bar"><i style="width:${Math.max(3,100*w.km/mx)}%"></i></div><span class="small muted">Længste: ${w.longest.toFixed(1)} km</span></div>`).join('')}</div>`;
}
function supp(){x.innerHTML="<h2>Supplerende</h2>"+S.map(a=>`<div class="card"><b>${a[0]}</b> <span class="small">${a[1]}</span><p class="muted">${a[2]}</p></div>`).join("")}
show("home");
</script>


<div id="manualLogOverlay">

  <h3 id="v6LogTitle">Log gennemført pas</h3>
  <div id="v6LogPlan" class="muted" style="margin-bottom:14px"></div>

   <label>Tid – sekunder<input id="v6Seconds" type="number" min="0" max="59" step="1" inputmode="numeric"></label>
   <label>Gns. puls<input id="v6Hr" type="number" step="1" inputmode="numeric"></label>
   <label>Gns. pace (min/km)<input id="v6Pace" type="text" placeholder="fx 3:38"></label>
   <label class="full">Noter<textarea id="v6Notes" placeholder="Hvordan føltes passet? Hvad skete der på de enkelte intervaller/blokke?"></textarea></label>
  </div>
  <div class="log-actions"><button class="log-cancel" onclick="closeV6Log()">Annuller</button><button class="log-save" onclick="saveV6Log()">Gem som gennemført</button></div>
 </div>
</div>
<script>
(function(){
 let active=null;
 function logs(){return JSON.parse(localStorage.getItem('runcoach_v6_logs')||'{}')}
 function save(x){localStorage.setItem('runcoach_v6_logs',JSON.stringify(x))}
 window.openV6Log=function(id){
   active=PLAN.find(p=>p.id===id); if(!active)return;
   const old=logs()[id]||{}, d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
   document.getElementById('v6LogTitle').textContent='Log gennemført pas';
   document.getElementById('v6LogPlan').innerHTML='<b>'+active.type+'</b> · '+active.name+'<br><span class="muted">Arbejde: '+active.main+' · Tempo: '+active.pace+' · Pause: '+active.recovery+'</span>';
   document.getElementById('v6LogStructure').innerHTML='<b>Planlagt struktur</b><br>'+active.detail;
   document.getElementById('v6Date').value=old.date||d.toISOString().slice(0,10);
   document.getElementById('v6Distance').value=old.distance||'';
   document.getElementById('v6Minutes').value=old.minutes??'';
   document.getElementById('v6Seconds').value=old.seconds??'';
   document.getElementById('v6Hr').value=old.hr||'';
   document.getElementById('v6Pace').value=old.pace||'';
   document.getElementById('v6Notes').value=old.notes||'';
   document.getElementById('manualLogOverlay').classList.add('open');
 };
 window.closeV6Log=function(){document.getElementById('manualLogOverlay').classList.remove('open');active=null};
 window.saveV6Log=function(){
   if(!active)return;
   let sec=Math.max(0,Math.min(59,parseInt(document.getElementById('v6Seconds').value||0,10)));
   let mins=Math.max(0,parseInt(document.getElementById('v6Minutes').value||0,10));
   let x=logs(); x[active.id]={id:active.id,plan:active,date:document.getElementById('v6Date').value,distance:document.getElementById('v6Distance').value,minutes:mins,seconds:sec,hr:document.getElementById('v6Hr').value,pace:document.getElementById('v6Pace').value,notes:document.getElementById('v6Notes').value};
   save(x); closeV6Log(); plan();
 };
})();
</script></body></html>
