window.openManualLog=(id,title,sub)=>{
 active={id:String(id),title:title||'Træningspas',sub:sub||''};
 document.getElementById('manualLogTitle').textContent='Log gennemført pas';
 document.getElementById('manualLogSubtitle').textContent=active.title+(active.sub?' · '+active.sub:'');
 const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());document.getElementById('logDate').value=d.toISOString().slice(0,10);
 ['logDistance','logDuration','logHr','logPace','logNotes'].forEach(x=>document.getElementById(x).value='');
 document.getElementById('manualLogOverlay').classList.add('open');
};
window.closeManualLog=()=>{document.getElementById('manualLogOverlay').classList.remove('open');active=null};
window.saveManualLog=()=>{
 if(!active)return;let x=logs();x[active.id]={...active,date:document.getElementById('logDate').value,distance:document.getElementById('logDistance').value,duration:document.getElementById('logDuration').value,hr:document.getElementById('logHr').value,pace:document.getElementById('logPace').value,notes:document.getElementById('logNotes').value};
 save(x);closeManualLog();render();
};
function render(){
 const x=logs();
 document.querySelectorAll('[data-manual-plan]').forEach(c=>{
  const id=c.dataset.manualPlan,old=c.querySelector('.manual-log-area');if(old)old.remove();
  const a=document.createElement('div');a.className='manual-log-area';let l=x[id];
  if(l){a.innerHTML='<div class="manual-done"><b>✓ Gennemført</b> · '+(l.date||'')+(l.distance?' · '+l.distance+' km':'')+(l.pace?' · '+l.pace+'/km':'')+(l.hr?' · '+l.hr+' bpm':'')+'</div><button class="plan-log-btn" type="button">Rediger</button>';a.querySelector('button').onclick=()=>openManualLog(id,c.dataset.title,'');}
  else{a.innerHTML='<button class="plan-log-btn" type="button">✓ Log gennemført pas</button>';a.querySelector('button').onclick=()=>openManualLog(id,c.dataset.title,'');}
  c.appendChild(a);
 });
}
function enhance(){
 let i=0;
 document.querySelectorAll('section,article,.card,.plan-card,li').forEach(el=>{
  if(el.dataset.manualPlan)return;let t=(el.innerText||'').trim();
  if(!t||t.length>500||!/400|600|800|1000|1200|1600|2000|3000|interval|strides|tempo|rolig|test/i.test(t))return;
  if(el.closest('#manualLogOverlay'))return;
  el.dataset.manualPlan='plan-'+(++i)+'-'+btoa(unescape(encodeURIComponent(t.slice(0,60)))).replace(/[^a-zA-Z0-9]/g,'').slice(0,12);
  el.dataset.title=t.split('\n')[0].slice(0,100);
 });
 render();
}
window.addEventListener('load',()=>setTimeout(enhance,700));
new MutationObserver(()=>setTimeout(enhance,150)).observe(document.body,{childList:true,subtree:true});
})();
</script></body></html>
